[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tachyon-sdk"
version = "1.0.0"
description = "Official Python client for Tachyon, the typo-tolerant full-text search engine."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Tachyon contributors" }]
requires-python = ">=3.8"
keywords = ["tachyon", "search", "full-text-search", "typo-tolerance", "bm25"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = ["requests>=2.28"]

[project.urls]
Homepage = "https://github.com/adikeshri/tachyon-sdk/tree/main/python"
Repository = "https://github.com/adikeshri/tachyon-sdk"

[project.optional-dependencies]
dev = ["pytest>=7.0", "responses>=0.23", "mypy>=1.8", "types-requests"]

[tool.hatch.build.targets.wheel]
packages = ["tachyon_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a live Tachyon server (set TACHYON_URL, defaults to localhost:8108)"]
addopts = "-m 'not integration'"

[tool.mypy]
# mypy itself requires >=3.9 as a checking target even though the package
# supports 3.8 at runtime (no 3.9+-only syntax is used anywhere).
python_version = "3.9"
strict = true
