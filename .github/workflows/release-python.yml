name: Release Python SDK

# Real releases are tag-triggered: pushing `python-vX.Y.Z` builds, tests,
# and publishes that exact version to PyPI, then cuts a GitHub release.
#
# `workflow_dispatch` exists to run the whole pipeline (build + unit +
# integration tests, and package build/check) against any branch without
# publishing anything — useful for validating a change to this workflow
# itself, or the package right before tagging it.
on:
  push:
    tags:
      - 'python-v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run the full pipeline but skip the actual PyPI publish / GitHub release
        type: boolean
        default: true

defaults:
  run:
    shell: bash
    working-directory: python

jobs:
  build-and-test:
    name: build & test
    runs-on: ubuntu-latest
    services:
      tachyon:
        image: adikeshri/tachyon
        ports:
          - 8108:8108
        env:
          TACHYON_ADMIN_KEY: admin-key
          TACHYON_SEARCH_KEY: search-key
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - run: pip install -e ".[dev]"
      - run: mypy tachyon_sdk
      - run: pytest

      - name: Wait for Tachyon to report healthy
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8108/health && exit 0
            sleep 1
          done
          echo "Tachyon never became healthy" >&2
          exit 1
      - run: pytest -m integration
        env:
          TACHYON_URL: http://localhost:8108
          TACHYON_ADMIN_KEY: admin-key
          TACHYON_SEARCH_KEY: search-key

      - name: Determine version and verify it matches the tag
        id: version
        run: |
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#python-v}"
            if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
              echo "::error::Tag python-v$TAG_VERSION does not match pyproject.toml version $PKG_VERSION. Bump pyproject.toml and retag."
              exit 1
            fi
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: pypi-package
          path: python/dist/*
          retention-days: 14

  publish:
    name: publish
    needs: build-and-test
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    runs-on: ubuntu-latest
    environment: pypi-release
    permissions:
      contents: write # create the GitHub release
      id-token: write # PyPI trusted publishing (OIDC)
    defaults:
      run:
        shell: bash
        working-directory: '.'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full tag history, for release-notes range detection

      - uses: actions/download-artifact@v4
        with:
          name: pypi-package
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # Leave `password` unset (PYPI_API_TOKEN secret absent) to use
          # PyPI's OIDC trusted-publishing flow instead, if the project is
          # configured for it on pypi.org. See RELEASING.md.
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-and-test.outputs.version }}
        run: |
          TAG="python-v${VERSION}"
          PREV_TAG=$(git tag --list 'python-v*' --sort=-v:refname | grep -vFx "$TAG" | head -n1 || true)
          NOTES_ARGS=(--generate-notes)
          if [[ -n "$PREV_TAG" ]]; then
            NOTES_ARGS+=(--notes-start-tag "$PREV_TAG")
          fi
          gh release create "$TAG" dist/* \
            --title "tachyon-sdk (Python) v${VERSION}" \
            "${NOTES_ARGS[@]}"
