name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # --- TypeScript --------------------------------------------------------

  typescript-unit:
    name: typescript / unit (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    strategy:
      fail-fast: false
      matrix:
        # vitest 4 pulls in `rolldown`, which imports `styleText` from
        # node:util at load time — an API only present from Node 20.12
        # onward, so Node 18 can't even boot the test runner. That's a test
        # *tooling* floor, not the built package's — package.json's
        # `engines` still claims >=18, verified separately below by the
        # node18-smoke job, which runs the built dist/ with plain `node`.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify the package builds and publishes cleanly
        run: |
          npm run build
          npm publish --dry-run

  typescript-node18-smoke:
    name: typescript / node 18 smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Run the built dist/ with plain node (no vitest/rolldown involved)
        run: npm run smoke

  typescript-integration:
    name: typescript / integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    services:
      tachyon:
        image: adikeshri/tachyon
        ports:
          - 8108:8108
        env:
          TACHYON_ADMIN_KEY: admin-key
          TACHYON_SEARCH_KEY: search-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - name: Wait for Tachyon to report healthy
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8108/health && exit 0
            sleep 1
          done
          echo "Tachyon never became healthy" >&2
          exit 1
      - run: npm run test:integration
        env:
          TACHYON_URL: http://localhost:8108
          TACHYON_ADMIN_KEY: admin-key
          TACHYON_SEARCH_KEY: search-key

  # --- Python --------------------------------------------------------------

  python-unit:
    name: python / unit (${{ matrix.python }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: mypy tachyon_sdk
      - run: pytest
      - name: Verify the package builds and passes twine's metadata check
        run: |
          pip install build twine
          python -m build
          twine check dist/*

  python-integration:
    name: python / integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    services:
      tachyon:
        image: adikeshri/tachyon
        ports:
          - 8108:8108
        env:
          TACHYON_ADMIN_KEY: admin-key
          TACHYON_SEARCH_KEY: search-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Wait for Tachyon to report healthy
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8108/health && exit 0
            sleep 1
          done
          echo "Tachyon never became healthy" >&2
          exit 1
      - run: pytest -m integration
        env:
          TACHYON_URL: http://localhost:8108
          TACHYON_ADMIN_KEY: admin-key
          TACHYON_SEARCH_KEY: search-key
