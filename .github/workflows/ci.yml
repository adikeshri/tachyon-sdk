name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # --- TypeScript --------------------------------------------------------

  typescript-unit:
    name: typescript / unit (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    strategy:
      fail-fast: false
      matrix:
        # vitest 4 pulls in `rolldown`, which imports `styleText` from
        # node:util at load time — an API only present from Node 20.12
        # onward, so Node 18 can't even boot the test runner. That's a test
        # *tooling* floor, not the built package's — package.json's
        # `engines` still claims >=18, verified separately below by the
        # node18-smoke job, which runs the built dist/ with plain `node`.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify the package builds and publishes cleanly
        run: |
          npm run build
          npm publish --dry-run

  typescript-node18-smoke:
    name: typescript / node 18 smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Run the built dist/ with plain node (no vitest/rolldown involved)
        run: npm run smoke

  typescript-integration:
    name: typescript / integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    services:
      tachyon:
        image: adikeshri/tachyon
        ports:
          - 8108:8108
        env:
          TACHYON_ADMIN_KEY: admin-key
          TACHYON_SEARCH_KEY: search-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - name: Wait for Tachyon to report healthy
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8108/health && exit 0
            sleep 1
          done
          echo "Tachyon never became healthy" >&2
          exit 1
      - run: npm run test:integration
        env:
          TACHYON_URL: http://localhost:8108
          TACHYON_ADMIN_KEY: admin-key
          TACHYON_SEARCH_KEY: search-key

  # --- Python --------------------------------------------------------------

  python-unit:
    name: python / unit (${{ matrix.python }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: mypy tachyon_sdk
      - run: pytest
      - name: Verify the package builds and passes twine's metadata check
        run: |
          pip install build twine
          python -m build
          twine check dist/*

  python-integration:
    name: python / integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    services:
      tachyon:
        image: adikeshri/tachyon
        ports:
          - 8108:8108
        env:
          TACHYON_ADMIN_KEY: admin-key
          TACHYON_SEARCH_KEY: search-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Wait for Tachyon to report healthy
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8108/health && exit 0
            sleep 1
          done
          echo "Tachyon never became healthy" >&2
          exit 1
      - run: pytest -m integration
        env:
          TACHYON_URL: http://localhost:8108
          TACHYON_ADMIN_KEY: admin-key
          TACHYON_SEARCH_KEY: search-key

  # --- Go --------------------------------------------------------------

  go-unit:
    name: go / unit (${{ matrix.go }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    strategy:
      fail-fast: false
      matrix:
        # go.mod's declared floor, and whatever's currently latest.
        go: ['1.21', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          # No go.sum to key a cache on — this module has zero dependencies.
          cache: false
      - name: Check gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt would reformat these files:"
            echo "$out"
            exit 1
          fi
      - run: go vet ./...
      - run: go vet -tags=integration ./...
      - run: go build ./...
      - run: go test ./...

  go-integration:
    name: go / integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    services:
      tachyon:
        image: adikeshri/tachyon
        ports:
          - 8108:8108
        env:
          TACHYON_ADMIN_KEY: admin-key
          TACHYON_SEARCH_KEY: search-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Wait for Tachyon to report healthy
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8108/health && exit 0
            sleep 1
          done
          echo "Tachyon never became healthy" >&2
          exit 1
      - run: go test -tags=integration ./integration/...
        env:
          TACHYON_URL: http://localhost:8108
          TACHYON_ADMIN_KEY: admin-key
          TACHYON_SEARCH_KEY: search-key

  # --- C# / .NET ---------------------------------------------------------

  csharp-unit:
    name: csharp / unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: csharp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet build Tachyon.Sdk.sln
      - run: dotnet test Tachyon.Sdk.sln
      - name: Verify the package packs cleanly
        run: dotnet pack Tachyon.Sdk/Tachyon.Sdk.csproj -c Release -o /tmp/nupkg

  csharp-integration:
    name: csharp / integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: csharp
    services:
      tachyon:
        image: adikeshri/tachyon
        ports:
          - 8108:8108
        env:
          TACHYON_ADMIN_KEY: admin-key
          TACHYON_SEARCH_KEY: search-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Wait for Tachyon to report healthy
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8108/health && exit 0
            sleep 1
          done
          echo "Tachyon never became healthy" >&2
          exit 1
      - run: dotnet test Tachyon.Sdk.IntegrationTests/Tachyon.Sdk.IntegrationTests.csproj
        env:
          TACHYON_URL: http://localhost:8108
          TACHYON_ADMIN_KEY: admin-key
          TACHYON_SEARCH_KEY: search-key

  # --- Java ----------------------------------------------------------------

  java-unit:
    name: java / unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B test

  java-integration:
    name: java / integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    services:
      tachyon:
        image: adikeshri/tachyon
        ports:
          - 8108:8108
        env:
          TACHYON_ADMIN_KEY: admin-key
          TACHYON_SEARCH_KEY: search-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Wait for Tachyon to report healthy
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8108/health && exit 0
            sleep 1
          done
          echo "Tachyon never became healthy" >&2
          exit 1
      - run: mvn -B verify
        env:
          TACHYON_URL: http://localhost:8108
          TACHYON_ADMIN_KEY: admin-key
          TACHYON_SEARCH_KEY: search-key
