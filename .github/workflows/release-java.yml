name: Release Java SDK

# Real releases are tag-triggered: pushing `java-vX.Y.Z` builds, tests, and
# publishes that exact version to Maven Central, then cuts a GitHub
# release.
#
# Unlike the npm/NuGet workflows here, this one doesn't build once and
# promote a pre-built artifact between jobs — Maven's signing and
# publishing are plugin-driven parts of the reactor build itself
# (maven-gpg-plugin, central-publishing-maven-plugin), not a step you can
# run over an arbitrary downloaded file. So `publish` does its own fresh
# `mvn deploy` from the same tagged commit instead, with tests skipped
# there since `build-and-test` already ran them as the gate. This is the
# standard shape for a Maven Central release, not a shortcut.
#
# `workflow_dispatch` exists to run the whole pipeline (build + unit +
# integration tests, and a release-profile package build through signing)
# against any branch without publishing anything — useful for validating a
# change to this workflow itself, or the package right before tagging it.
on:
  push:
    tags:
      - 'java-v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run the full pipeline but skip the actual Maven Central publish / GitHub release
        type: boolean
        default: true

defaults:
  run:
    shell: bash
    working-directory: java

jobs:
  build-and-test:
    name: build & test
    runs-on: ubuntu-latest
    services:
      tachyon:
        image: adikeshri/tachyon
        ports:
          - 8108:8108
        env:
          TACHYON_ADMIN_KEY: admin-key
          TACHYON_SEARCH_KEY: search-key
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - run: mvn -B test

      - name: Wait for Tachyon to report healthy
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8108/health && exit 0
            sleep 1
          done
          echo "Tachyon never became healthy" >&2
          exit 1
      - run: mvn -B verify
        env:
          TACHYON_URL: http://localhost:8108
          TACHYON_ADMIN_KEY: admin-key
          TACHYON_SEARCH_KEY: search-key

      - name: Determine version and verify it matches the tag
        id: version
        run: |
          PKG_VERSION=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#java-v}"
            if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
              echo "::error::Tag java-v$TAG_VERSION does not match pom.xml version $PKG_VERSION. Bump the pom and retag."
              exit 1
            fi
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Sanity-check the release profile builds (signing excepted — no key here)
        run: mvn -B -P release package -DskipTests -DskipITs

  publish:
    name: publish
    needs: build-and-test
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    runs-on: ubuntu-latest
    environment: maven-central-release
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full tag history, for release-notes range detection

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Build, sign, and publish to Maven Central
        working-directory: java
        run: mvn -B -P release deploy -DskipTests -DskipITs
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-and-test.outputs.version }}
        run: |
          TAG="java-v${VERSION}"
          PREV_TAG=$(git tag --list 'java-v*' --sort=-v:refname | grep -vFx "$TAG" | head -n1 || true)
          NOTES_ARGS=(--generate-notes)
          if [[ -n "$PREV_TAG" ]]; then
            NOTES_ARGS+=(--notes-start-tag "$PREV_TAG")
          fi
          gh release create "$TAG" java/target/tachyon-sdk-*.jar \
            --title "tachyon-sdk (Java) v${VERSION}" \
            "${NOTES_ARGS[@]}"
